apiVersion: v1
kind: Service
metadata:
  name: punitxd-flask-hello-world
  namespace: kairo-punitxd-flask-hello-world
  labels:
    app: punitxd-flask-hello-world
    app.kubernetes.io/managed-by: kairo
spec:
  # cluster-internal only: all outside traffic comes in through Traefik's
  # Ingress, so request metrics are always counted
  type: ClusterIP
  selector:
    app: punitxd-flask-hello-world
  ports:
    - name: http
      port: 80
      targetPort: 8000
